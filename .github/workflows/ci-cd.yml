name: CI/CD Pipeline

on:
  push:
    branches: ['**']  # Run tests on ALL branches
  pull_request:
    branches: ['**']  # Run tests on PRs to ANY branch
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Job 1: Build - Install deps and build the app
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/
      
      - name: Delete package-lock if exists
        run: rm -f package-lock.json
        continue-on-error: true
      
      - name: Install dependencies
        run: |
          npm install --registry=https://registry.npmjs.org/
          npm install ajv@^8.0.0 --save-dev --registry=https://registry.npmjs.org/
      
      - name: Check for dependency vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Build React application
        run: npm run build
        env:
          CI: false
      
      - name: Check build size
        run: |
          echo "📦 Build Size Analysis:"
          du -sh build/
          echo ""
          echo "📊 Largest files in build:"
          find build -type f -exec du -h {} + | sort -rh | head -10
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/
          retention-days: 7

  # Job 2: Lint - Runs in parallel after build
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/
      
      - name: Delete package-lock if exists
        run: rm -f package-lock.json
        continue-on-error: true
      
      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org/
      
      - name: Run ESLint
        run: npx eslint src/ --ext .js,.jsx --max-warnings 100

  # Job 3: Unit Tests - Runs in parallel after build
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/
      
      - name: Delete package-lock if exists
        run: rm -f package-lock.json
        continue-on-error: true
      
      - name: Install dependencies
        run: |
          npm install --registry=https://registry.npmjs.org/
          npm install ajv@^8.0.0 --save-dev --registry=https://registry.npmjs.org/
      
      - name: Run Unit Tests
        run: npm run test -- --watchAll=false --coverage --passWithNoTests
        env:
          CI: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: cyo-rugs-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Job 4: E2E Tests - Runs in parallel after build
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/
      
      - name: Delete package-lock if exists
        run: rm -f package-lock.json
        continue-on-error: true
      
      - name: Install dependencies
        run: |
          npm install --registry=https://registry.npmjs.org/
          npm install ajv@^8.0.0 --save-dev --registry=https://registry.npmjs.org/
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Job 5: Health Check - Verify production site is healthy
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [build, lint, unit-test, e2e-test]
    # Only run health check on main/master branch or when manually triggered
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      
      - name: Run Health Check
        run: node src/spec/health-check.js
        env:
          HEALTH_CHECK_URL: https://www.cyorugs.com
        continue-on-error: true
      
      - name: Health Check Summary
        if: always()
        run: |
          echo "Health check completed for production site"
          echo "Site: https://www.cyorugs.com"

  # Job 6: Success Summary - Runs only if all tests pass
  pipeline-success:
    name: Pipeline Success
    runs-on: ubuntu-latest
    needs: [build, lint, unit-test, e2e-test]
    
    steps:
      - name: Pipeline Success
        run: |
          echo "✅ All tests passed!"
          echo "🚀 Ready for deployment via Heroku"
          echo ""
          echo "Pipeline Summary:"
          echo "  ✓ Build successful"
          echo "  ✓ Lint checks passed (ESLint)"
          echo "  ✓ Unit tests passed (Jest)"
          echo "  ✓ E2E tests passed (Playwright)"
          echo "  ✓ Security audit completed"
          echo "  ✓ Build size analyzed"
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"


