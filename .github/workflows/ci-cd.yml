name: CI/CD Pipeline

on:
  push:
    branches: ['**']  # Run tests on ALL branches
  pull_request:
    branches: ['**']  # Run tests on PRs to ANY branch

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'
      
      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/
      
      - name: Delete package-lock if exists
        run: rm -f package-lock.json
        continue-on-error: true
      
      - name: Install dependencies
        run: npm install --registry=https://registry.npmjs.org/ --legacy-peer-deps
      
      - name: Run ESLint
        run: npx eslint src/ --ext .js,.jsx --max-warnings 100
        continue-on-error: true
      
      - name: Run frontend unit tests
        run: npm run test -- --watchAll=false --passWithNoTests
        env:
          CI: true
      
      - name: Build application
        run: npm run build
        env:
          CI: false
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/
          retention-days: 7
      
      # Placeholder for backend tests (will add when created)
      # - name: Run backend integration tests
      #   run: npm run test:backend
      
      # Placeholder for E2E tests (will add when created)
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps chromium
      # 
      # - name: Run E2E tests
      #   run: npm run test:e2e
      
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      
      - name: Pipeline Success
        run: |
          echo "✅ All tests passed!"
          echo "🚀 Ready for deployment via Heroku"


